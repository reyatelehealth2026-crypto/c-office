<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#0a0a1a;font-family:'JetBrains Mono',monospace;padding:16px;display:flex;gap:10px;flex-wrap:wrap}
.s{flex:1;min-width:90px;border-radius:10px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:100px;border:1px solid rgba(255,255,255,0.08)}
.s span{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;opacity:0.7}
.s b{font-size:10px;margin-top:2px;opacity:0.9}
</style></head><body>
<div class="s" style="background:#0a0a1a;color:#6f739b;border-color:#2a2d5a"><span>bg-0</span><b>#0a0a1a</b></div>
<div class="s" style="background:#0d0e24;color:#6f739b;border-color:#2a2d5a"><span>bg-1</span><b>#0d0e24</b></div>
<div class="s" style="background:#11122b;color:#a0a3c0;border-color:#2a2d5a"><span>bg-2</span><b>#11122b</b></div>
<div class="s" style="background:#1a1c3d;color:#a0a3c0;border-color:#444a88"><span>bg-3</span><b>#1a1c3d</b></div>
<div class="s" style="background:#2a2d5a;color:#f0f0ff"><span>border</span><b>#2a2d5a</b></div>
<div class="s" style="background:#444a88;color:#f0f0ff"><span>border-2</span><b>#444a88</b></div>
</body></html>
