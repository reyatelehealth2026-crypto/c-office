<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#0a0a1a;font-family:'JetBrains Mono',monospace;padding:16px;display:flex;gap:10px;flex-wrap:wrap}
.s{flex:1;min-width:100px;border-radius:10px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:100px;border:1px solid rgba(255,255,255,0.08)}
.s span{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;opacity:0.7}
.s b{font-size:10px;margin-top:2px}
</style></head><body>
<div class="s" style="background:rgba(52,211,153,0.15);color:#34d399;border-color:rgba(52,211,153,0.3)"><span>Success</span><b>#34d399</b></div>
<div class="s" style="background:rgba(245,158,11,0.15);color:#f59e0b;border-color:rgba(245,158,11,0.3)"><span>Warning</span><b>#f59e0b</b></div>
<div class="s" style="background:rgba(251,113,133,0.15);color:#fb7185;border-color:rgba(251,113,133,0.3)"><span>Danger</span><b>#fb7185</b></div>
<div class="s" style="background:rgba(56,189,248,0.15);color:#38bdf8;border-color:rgba(56,189,248,0.3)"><span>Info</span><b>#38bdf8</b></div>
<div class="s" style="background:rgba(100,116,139,0.15);color:#64748b;border-color:rgba(100,116,139,0.3)"><span>Offline</span><b>#64748b</b></div>
</body></html>
