<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#0a0a1a;color:#f0f0ff;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:baseline;gap:16px}
.label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#6f739b;min-width:80px;flex-shrink:0}

<div class="row"><span class="label">Display</span><span style="font:800 36px/1 'Space Grotesk',sans-serif;letter-spacing:-0.045em">Command Deck</span></div>

<div class="row"><span class="label">Section</span><span style="font:700 16px/1.3 'Space Grotesk',sans-serif">Live Activity Feed</span></div>
<div class="row"><span class="label">Body</span><span style="font:400 14px/1.5 'Inter',sans-serif;color:#a0a3c0">System overview and active agents across all sessions.</span></div>
<div class="row"><span class="label">Kicker</span><span style="font:800 10px/1 'JetBrains Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;color:#22d3ee">ORCHESTRA RUNS</span></div>
<div class="row"><span class="label">Code</span><span style="font:400 13px/1.5 'JetBrains Mono',monospace;color:#00f0ff;background:#11122b;padding:2px 8px;border-radius:4px">npm run dev</span></div>
