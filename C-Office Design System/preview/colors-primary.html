<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#0a0a1a;font-family:'JetBrains Mono',monospace;padding:16px;display:flex;gap:10px;flex-wrap:wrap}
.s{flex:1;min-width:80px;border-radius:10px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:100px;border:1px solid rgba(255,255,255,0.08)}
.s span{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;opacity:0.85}
.s b{font-size:11px;margin-top:2px}
</style></head><body>
<div class="s" style="background:#00f0ff;color:#0a0a1a"><span>Cyan</span><b>#00f0ff</b></div>
<div class="s" style="background:#8b5cf6;color:#fff"><span>Violet</span><b>#8b5cf6</b></div>
<div class="s" style="background:#ff00a0;color:#fff"><span>Magenta</span><b>#ff00a0</b></div>
<div class="s" style="background:#ffd700;color:#0a0a1a"><span>Gold</span><b>#ffd700</b></div>
<div class="s" style="background:#39ff14;color:#0a0a1a"><span>Lime</span><b>#39ff14</b></div>
<div class="s" style="background:#ff6b35;color:#fff"><span>Orange</span><b>#ff6b35</b></div>
<div class="s" style="background:#ff3366;color:#fff"><span>Red</span><b>#ff3366</b></div>
</body></html>
