<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" href="/images/Orchestra.png"/>
<title>C-Office — AI Agent Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="cards.css"/>
<link rel="stylesheet" href="adventure.css"/>
<link rel="stylesheet" href="notes.css"/>
<link rel="stylesheet" href="scene.css"/>
<link rel="stylesheet" href="guild.css"/>
<style>
.feed-row {
  display:flex; gap:12px; align-items:center;
  padding: 10px 8px;
  border-radius: 8px;
  transition: background 120ms;
  cursor: pointer;
}
.feed-row:hover { background: var(--bg-2); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="guild-icons.jsx"></script>
<script type="text/babel" src="page-guild.jsx"></script>
<script type="text/babel" src="page-agents.jsx"></script>
<script type="text/babel" src="page-shop.jsx"></script>
<script type="text/babel" src="page-dashboard.jsx"></script>
<script type="text/babel" src="page-detail.jsx"></script>
<script type="text/babel" src="page-memory.jsx"></script>
<script type="text/babel" src="page-misc.jsx"></script>
<script type="text/babel" src="page-adventure.jsx"></script>
<script type="text/babel" src="page-notes.jsx"></script>
<script type="text/babel" src="page-scene.jsx"></script>

<script type="text/babel">
const App = () => {
  const [page, setPage] = React.useState(() => localStorage.getItem('c-office-page') || 'dashboard');
  const [activeAgent, setActiveAgent] = React.useState(null);
  const [dashLayout, setDashLayout] = React.useState('overview');
  useCOfficeRefresh();

  React.useEffect(() => { localStorage.setItem('c-office-page', page); }, [page]);

  // Cross-page navigation requests (e.g. inline-dispatch helpers in page-scene.jsx
  // that ship the user from Adventure / Guild straight to the notes chat panel).
  React.useEffect(() => {
    const onNav = (e) => {
      const target = e.detail?.page;
      if (target) { setPage(target); setActiveAgent(null); }
    };
    window.addEventListener('c-office:navigate', onNav);
    return () => window.removeEventListener('c-office:navigate', onNav);
  }, []);

  const openAgent = (id) => { setActiveAgent(id); setPage('agent-detail'); };
  const agent = AGENTS.find(a => a.id === activeAgent);

  return (
    <div className="app" data-screen-label={page}>
      <Sidebar page={page} setPage={(p) => { setPage(p); setActiveAgent(null); }}/>
      <main className="main">
        {page === 'dashboard' && <GuildHall onOpenAgent={openAgent}/>}
        {page === 'mission-control' && <Dashboard layout={dashLayout} setLayout={setDashLayout} onOpenAgent={openAgent}/>}
        {page === 'agents' && <AgentsPage onOpenAgent={openAgent} setPage={setPage}/>}
        {page === 'shop' && <AgentShopPage onOpenAgent={openAgent}/>}
        {page === 'agent-detail' && agent && <AgentDetail agent={agent} onBack={() => setPage('agents')} onOpenAgent={openAgent}/>}
        {page === 'tasks' && <TasksPage onOpenAgent={openAgent}/>}
        {page === 'skills' && <SkillsPage onOpenAgent={openAgent}/>}
        {page === 'memory' && <MemoryPanel onOpenAgent={openAgent}/>}
        {page === 'settings' && <SettingsPage/>}
        {page === 'adventure' && <AdventurePage onOpenAgent={openAgent}/>}
        {page === 'notes' && <NotesPage onOpenAgent={openAgent}/>}
      </main>
      <SceneOverlay/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
